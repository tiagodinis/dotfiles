# Apple Magic Keyboard (004c:029f:0ce7a8a1) — USB or Bluetooth.
# Confirmed: ⌘ = leftmeta (already SUPER/meta, next to space), ⌥ = leftalt.
# So NO Alt/Super flip here — just the mac-style app-shortcut translations.
# When ⌘/meta is held, these keys send Ctrl+... into the focused app (every app);
# all other ⌘ combos pass through as SUPER (workspaces, VS Code meta nav, etc.).
# Copy/paste/cut added 2026-09-08 (see default.conf note): SUPER+C/V/X -> Ctrl+
# at keyd level so Hyprland's universal-clipboard injection never runs.

[ids]
004c:029f:0ce7a8a1

[meta]
s = C-s
z = C-z
a = C-a
w = C-w
t = C-t
tab = C-tab
r = C-r
c = C-c
v = C-v
x = C-x
f = C-f
# keyd automatically applies Shift to letter mappings, so ⌘+Shift+F becomes
# Ctrl+Shift+F without needing an explicit shift+f entry.
# Text navigation: ⌘+←/→ = word-by-word (Ctrl+arrows); ⌘+Shift+←/→ selects.
left = C-left
right = C-right
