# HP internal (Windows-layout) keyboard 0001:0001:6fb3735a
# - Swap Left Alt <-> Left Super so the key next to the spacebar is SUPER/meta
#   (mac-like), consistent with an Apple Magic Keyboard (⌘ = Super, ⌥ = Alt).
# - Mac-style app shortcuts in EVERY app: SUPER+<key> -> Ctrl+<key> (see [meta]).
#   Unmapped SUPER combos pass through as SUPER, so Hyprland bindings still work.
# - Copy/paste/cut: SUPER+C/V/X -> Ctrl+C/V/X at keyd level (2026-09-08) so
#   Hyprland's universal-clipboard *injection* never runs. Injection while SUPER
#   is physically held resets the held-modifier state, so the next SUPER+key
#   after a copy/paste was read as a plain key (had to re-press SUPER).
# - Find + text navigation (2026-09-10): SUPER+F -> Ctrl+F (find, incl. the
#   browser); SUPER+arrows -> Ctrl+arrows (move/select word by word).

[ids]
0001:0001:6fb3735a

[main]
leftalt = layer(meta)
leftmeta = layer(alt)

[meta]
s = C-s
z = C-z
a = C-a
w = C-w
t = C-t
tab = C-tab
r = C-r
c = C-c
v = C-v
x = C-x
f = C-f
# keyd automatically applies Shift to letter mappings, so SUPER+Shift+F becomes
# Ctrl+Shift+F without needing an explicit shift+f entry.
# Text navigation: SUPER+←/→ = word-by-word (Ctrl+arrows). keyd keeps held
# modifiers, so SUPER+Shift+←/→ = select word-by-word.
left = C-left
right = C-right
